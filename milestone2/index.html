<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Search | Open Library</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/common.js" defer></script>
  <script src="js/search.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header><p class="eyebrow">IT 4403 &bull; MILESTONE 2</p><h1>Book Search</h1><p>Search for your next book.</p></header>
  <nav aria-label="Main navigation"><a href="index.html" aria-current="page">Home</a><a href="bookshelf.html" >My Bookshelf</a></nav>
  <main id="main"><section class="panel"><h2>Find a book</h2><form id="search-form"><label for="query">Title, author, or keyword</label><div class="search-row"><input id="query" name="q" type="search" placeholder="Try data analysis" maxlength="300"><button type="submit">Search</button></div></form><p class="hint">Browse up to 60 matches, with 10 books per page.</p></section><p id="status" role="status" aria-live="polite">Enter a search term to begin.</p><div id="pagination" hidden><label for="page-number">Results page</label> <select id="page-number"></select></div><section id="results" class="book-grid" aria-label="Search results"></section><noscript><p>Please enable JavaScript to load books.</p></noscript></main>
  <footer>Emmanuel Osime &bull; Book data and covers from <a href="https://openlibrary.org">Open Library</a></footer>
</body>
</html>
