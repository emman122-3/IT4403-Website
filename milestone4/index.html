<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Library | Milestone 4</title>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/jquery-3.7.1.min.js" defer></script>
  <script src="vendor/mustache-4.2.0.min.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="masthead">
    <div class="shell masthead-inner">
      <span class="brand">Open Library</span>
      <nav class="views" aria-label="Library sections">
        <button type="button" data-section="search" aria-pressed="true" aria-controls="search">Search Results</button>
        <button type="button" data-section="collection" aria-pressed="false" aria-controls="collection">Science Fiction</button>
      </nav>
    </div>
  </header>
  <main id="main" class="shell">
    <div class="hero">
      <h1>Explore the catalog</h1>
      <form id="search-form" novalidate>
        <label for="search-input">Search by title, author, or keyword</label>
        <div class="search-row">
          <input id="search-input" name="q" type="search" maxlength="200" placeholder="Try The Hobbit" aria-describedby="search-status">
          <button id="search-button" class="primary" type="submit">Search</button>
        </div>
      </form>
    </div>
    <div class="catalog">
      <section id="search" class="browsing" aria-labelledby="search-heading">
        <div class="section-top">
          <h2 id="search-heading">Search Results</h2>
          <div class="layout-picker" role="group" aria-label="Search results layout">
            <button type="button" data-layout="grid" aria-pressed="true">Grid View</button>
            <button type="button" data-layout="list" aria-pressed="false">List View</button>
          </div>
        </div>
        <p id="search-status" class="status" role="status">Enter a title, author, or keyword to begin.</p>
        <nav id="pagination" aria-label="Search result pages" hidden></nav>
        <div id="results" class="books" data-layout="grid" aria-busy="false"></div>
      </section>
      <section id="collection" class="browsing" aria-labelledby="collection-heading" hidden>
        <div class="section-top">
          <h2 id="collection-heading">Science Fiction Collection</h2>
          <div class="layout-picker" role="group" aria-label="Collection layout">
            <button type="button" data-layout="grid" aria-pressed="true">Grid View</button>
            <button type="button" data-layout="list" aria-pressed="false">List View</button>
          </div>
        </div>
        <p id="collection-status" class="status" role="status"></p>
        <button id="collection-retry" type="button" hidden>Retry collection</button>
        <div id="collection-books" class="books" data-layout="grid" aria-busy="false"></div>
      </section>
      <section id="details" aria-labelledby="details-heading" tabindex="-1">
        <div class="section-top">
          <h2 id="details-heading">Book Details</h2>
          <button id="back-to-books" type="button" hidden>Back to books</button>
        </div>
        <p id="details-status" class="status" role="status">Select a title to see its description, subjects, and publication information.</p>
        <div id="book-details" aria-busy="false"></div>
      </section>
    </div>
  </main>
  <footer class="shell">
    <span>Emmanuel Osime · IT 4403 · Milestone 4</span>
    <a href="https://openlibrary.org" target="_blank" rel="noopener noreferrer">Book data from Open Library</a>
  </footer>
  <noscript>This application requires JavaScript to retrieve and display books.</noscript>

  <script type="text/x-mustache-template" id="cover-template">
    <div class="cover">
      {{#coverUrl}}<img src="{{coverUrl}}" alt="Cover of {{title}}" loading="lazy">{{/coverUrl}}
      <span {{#coverUrl}}hidden{{/coverUrl}}>Cover unavailable</span>
    </div>
  </script>
  <script type="text/x-mustache-template" id="book-template">
    {{#books}}
    <article class="book-card">
      {{> cover}}
      <div class="book-summary">
        <h3>{{#slot}}<button type="button" class="book-select" data-slot="{{slot}}">{{title}}</button>{{/slot}}{{^slot}}{{title}}{{/slot}}</h3>
        <p>{{authorText}}</p>
        {{#year}}<p class="book-year">{{year}}</p>{{/year}}
        {{^slot}}<p>Work ID unavailable.</p>{{/slot}}
      </div>
    </article>
    {{/books}}
  </script>
  <script type="text/x-mustache-template" id="detail-template">
    <div class="detail-layout">
      {{> cover}}
      <div>
        <h3>{{title}}</h3>
        <p class="detail-author">{{authorText}}</p>
        <dl class="metadata">
          <dt>Work ID</dt><dd>{{workId}}</dd>
          {{#published}}<dt>First published</dt><dd>{{published}}</dd>{{/published}}
          {{#language}}<dt>Languages</dt><dd>{{language}}</dd>{{/language}}
        </dl>
      </div>
    </div>
    <h4>Description</h4>
    <p class="description">{{description}}</p>
    <h4>Subjects</h4>
    {{#hasSubjects}}<ul class="subjects">{{#subjects}}<li>{{.}}</li>{{/subjects}}</ul>{{/hasSubjects}}
    {{^hasSubjects}}<p>No subjects are available for this book.</p>{{/hasSubjects}}
    <a class="record-link" href="{{recordUrl}}" target="_blank" rel="noopener noreferrer">View original Open Library record ↗</a>
  </script>
</body>
</html>
